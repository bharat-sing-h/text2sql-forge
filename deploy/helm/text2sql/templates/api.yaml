apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "text2sql.fullname" . }}-api
  labels: {{- include "text2sql.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels: {{- include "text2sql.labels" . | nindent 8 }}
        app.kubernetes.io/component: api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 1000}
      containers:
        - name: api
          image: {{ .Values.api.image }}
          env:
            - {name: T2S_BACKEND_URL, value: "http://{{ include "text2sql.fullname" . }}-vllm:8000/v1"}
            - {name: T2S_MODEL, value: {{ .Values.model.servedName | quote }}}
            - {name: T2S_DB_ROOT, value: /data/databases}
            - {name: T2S_MAX_REPAIRS, value: {{ .Values.api.maxRepairs | quote }}}
            - {name: T2S_MAX_ROWS, value: {{ .Values.api.maxRows | quote }}}
          ports: [{name: http, containerPort: 8080}]
          livenessProbe:
            httpGet: {path: /healthz, port: http}
          readinessProbe:
            httpGet: {path: /readyz, port: http}   # not ready until the model server is
            periodSeconds: 10
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
          securityContext: {readOnlyRootFilesystem: true, allowPrivilegeEscalation: false}
          volumeMounts:
            - {name: databases, mountPath: /data/databases, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: databases
          persistentVolumeClaim:
            claimName: {{ .Values.api.databases.persistentVolumeClaim }}
            readOnly: true
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "text2sql.fullname" . }}-api
  labels: {{- include "text2sql.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: api
  ports: [{name: http, port: {{ .Values.service.port }}, targetPort: http}]
{{- if .Values.api.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "text2sql.fullname" . }}-api
  labels: {{- include "text2sql.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "text2sql.fullname" . }}-api
  minReplicas: {{ .Values.api.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.api.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: {{ .Values.api.autoscaling.targetCPUUtilization }}}
{{- end }}
