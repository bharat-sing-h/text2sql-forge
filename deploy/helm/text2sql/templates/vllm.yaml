apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "text2sql.fullname" . }}-hf-cache
  labels: {{- include "text2sql.labels" . | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: {{ .Values.vllm.cacheSize }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "text2sql.fullname" . }}-vllm
  labels: {{- include "text2sql.labels" . | nindent 4 }}
    app.kubernetes.io/component: model-server
spec:
  replicas: {{ .Values.vllm.replicas }}
  strategy: {type: Recreate}   # one GPU per pod: don't run two copies during a rollout
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: model-server
  template:
    metadata:
      labels: {{- include "text2sql.labels" . | nindent 8 }}
        app.kubernetes.io/component: model-server
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
    spec:
      containers:
        - name: vllm
          image: {{ .Values.vllm.image }}
          args:
            - --model={{ .Values.model.name }}
            - --served-model-name={{ .Values.model.servedName }}
            - --max-model-len={{ .Values.model.maxModelLen }}
            - --gpu-memory-utilization={{ .Values.model.gpuMemoryUtilization }}
            - --enable-prefix-caching
          {{- if .Values.model.hfTokenSecret }}
          env:
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef: {name: {{ .Values.model.hfTokenSecret }}, key: HF_TOKEN}
          {{- end }}
          ports: [{name: http, containerPort: 8000}]
          # model download + load can take minutes: gate traffic on /health, not on start
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
          resources: {{- toYaml .Values.vllm.resources | nindent 12 }}
          volumeMounts:
            - {name: hf-cache, mountPath: /root/.cache/huggingface}
            - {name: shm, mountPath: /dev/shm}
      volumes:
        - name: hf-cache
          persistentVolumeClaim: {claimName: {{ include "text2sql.fullname" . }}-hf-cache}
        - name: shm
          emptyDir: {medium: Memory, sizeLimit: 2Gi}
      {{- with .Values.vllm.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.vllm.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "text2sql.fullname" . }}-vllm
  labels: {{- include "text2sql.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: model-server
  ports: [{name: http, port: 8000, targetPort: http}]
