# Full stack on one GPU host:
#   MODEL=<hf-repo-or-path-of-merged-model> docker compose -f deploy/docker-compose.yml up -d
# API: http://localhost:8080/docs   Grafana: http://localhost:3000 (admin/admin)
services:
  vllm:
    image: vllm/vllm-openai:v0.6.6
    command:
      - --model=${MODEL:-Qwen/Qwen2.5-Coder-1.5B-Instruct}
      - --served-model-name=sql
      - --max-model-len=4096
      - --gpu-memory-utilization=0.85
      - --dtype=half
      - --enable-prefix-caching   # schema prompts repeat across questions: big prefill savings
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - hf-cache:/root/.cache/huggingface
      - ../outputs:/models:ro
    ports: ["8000:8000"]
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: 1, capabilities: [gpu]}]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 20s
      timeout: 5s
      retries: 30

  api:
    build: {context: .., dockerfile: deploy/docker/Dockerfile.api}
    environment:
      T2S_BACKEND_URL: http://vllm:8000/v1
      T2S_MODEL: sql
      T2S_DB_ROOT: /data/databases
      T2S_MAX_REPAIRS: "1"
    volumes:
      - ${DB_ROOT:-../data/synthetic/databases}:/data/databases:ro
    ports: ["8080:8080"]
    depends_on:
      vllm: {condition: service_healthy}

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes: ["./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]

volumes:
  hf-cache:
