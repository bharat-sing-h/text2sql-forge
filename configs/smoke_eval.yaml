# Smoke-test variant of eval_local.yaml reading the .t2s/ workspace (see `make smoke`).
model:
  provider: function
  target: t2sforge.infer:answer
  model: ${RUN_NAME:-local}

plugins: [t2sforge.eval.llmverdict_plugin]

tasks:
  - path: ../.t2s/eval/${EVAL_SET:-synthetic}_eval.jsonl
    name: ${EVAL_SET:-synthetic}
    limit: ${LIMIT:-1034}
    scorers:
      - {type: execution_accuracy, options: {db_root: "${DB_ROOT:-data/spider/database}"}}
      - sql_valid

execution:
  concurrency: 1        # one GPU, sequential generate() calls
  cache: false
