# CI / laptop smoke run: tiny random model built offline by `t2s tiny-model`.
base_model: .t2s/tiny-model
train_file: .t2s/sft/train.jsonl
val_file: .t2s/sft/val.jsonl
output_dir: .t2s/out
quantization: none
precision: fp32
max_seq_len: 4096
max_steps: 20
per_device_batch_size: 4
gradient_accumulation_steps: 1
learning_rate: 3.0e-3
logging_steps: 5
eval_steps: 10
save_steps: 10
