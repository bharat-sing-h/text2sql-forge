# Evaluate any OpenAI-compatible server on Spider dev with llm-verdict + execution accuracy.
# Run from the repo root (db_root is relative to it):
#   MODEL=sql llmverdict run configs/eval_spider.yaml --label finetuned
#   MODEL=Qwen/Qwen2.5-Coder-1.5B-Instruct llmverdict run configs/eval_spider.yaml --label base
#   llmverdict compare base__spider finetuned__spider
model:
  provider: openai_compat
  model: ${MODEL:-sql}
  base_url: ${BASE_URL:-http://localhost:8000/v1}
  api_key_env: null

params:
  temperature: 0
  max_tokens: 256

plugins: [t2sforge.eval.llmverdict_plugin]

tasks:
  - path: ../data/eval/spider_eval.jsonl
    name: spider
    scorers:
      - {type: execution_accuracy, options: {db_root: "${DB_ROOT:-data/spider/database}"}}
      - sql_valid

execution:
  concurrency: 16       # vLLM batches concurrent requests; raise until GPU saturates
  timeout_s: 120
