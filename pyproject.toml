[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "t2sforge"
version = "0.1.0"
description = "Fine-tune, serve and evaluate a small open LLM for text-to-SQL: QLoRA training, sandboxed execution, vLLM serving and execution-accuracy evaluation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "bharat-sing-h" }]
keywords = ["text-to-sql", "llm", "fine-tuning", "qlora", "vllm", "mlops"]
dependencies = [
  "pydantic>=2.6",
  "sqlglot>=25",
  "pyyaml>=6.0",
  "typer>=0.12",
  "rich>=13.7",
  "httpx>=0.27",
]

[project.optional-dependencies]
serve = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "prometheus-client>=0.20"]
train = [
  "torch>=2.2",
  "transformers>=4.44",
  "peft>=0.12",
  "accelerate>=0.33",
  "bitsandbytes>=0.43; platform_system == 'Linux'",
]
eval = ["llmverdict @ git+https://github.com/bharat-sing-h/llm-verdict"]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "respx>=0.21",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-PyYAML",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "prometheus-client>=0.20",
]

[project.scripts]
t2s = "t2sforge.cli:app"

[project.urls]
Repository = "https://github.com/bharat-sing-h/text2sql-forge"

[tool.hatch.build.targets.wheel]
packages = ["src/t2sforge"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"
markers = ["slow: needs torch + transformers (tiny random model, CPU)"]

[tool.coverage.run]
source = ["t2sforge"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "@abstractmethod"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PT"]
ignore = ["B008", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.10"
strict = true
mypy_path = "src"
packages = ["t2sforge"]

[[tool.mypy.overrides]]
module = ["llmverdict.*", "prometheus_client.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Heavy, optional ML stack: always treat as Any so type-checking gives the same result with or
# without torch installed (the lint job doesn't install CUDA wheels).
module = ["torch.*", "transformers.*", "peft.*", "tokenizers.*", "datasets.*"]
follow_imports = "skip"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# llm-verdict may be absent (optional extra) -> its Scorer base is typed as Any
module = ["t2sforge.eval.*"]
disallow_subclassing_any = false
